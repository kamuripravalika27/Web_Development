<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <!-- Google Font: Outfit for a clean, modern aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-card">
    <div class="calculator-header">
      <div class="header-indicator">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <span class="calculator-title">CALC 2.0</span>
      <button id="theme-toggle" class="theme-toggle" title="Toggle Theme" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
    </div>

    <!-- Display Screen -->
    <div class="display-container">
      <div id="previous-operand" class="previous-operand"></div>
      <div id="current-operand" class="current-operand">0</div>
    </div>

    <!-- Calculator Buttons Grid -->
    <div class="keypad-grid">
      <!-- Row 1 -->
      <button class="btn btn-action" data-action="clear" title="All Clear (Escape)">AC</button>
      <button class="btn btn-action" data-action="delete" title="Backspace">DEL</button>
      <button class="btn btn-action" data-action="percent" title="Percentage (%)">%</button>
      <button class="btn btn-operator" data-operator="÷" title="Divide (/)">÷</button>

      <!-- Row 2 -->
      <button class="btn btn-number" data-number="7">7</button>
      <button class="btn btn-number" data-number="8">8</button>
      <button class="btn btn-number" data-number="9">9</button>
      <button class="btn btn-operator" data-operator="×" title="Multiply (*)">×</button>

      <!-- Row 3 -->
      <button class="btn btn-number" data-number="4">4</button>
      <button class="btn btn-number" data-number="5">5</button>
      <button class="btn btn-number" data-number="6">6</button>
      <button class="btn btn-operator" data-operator="−" title="Subtract (-)">−</button>

      <!-- Row 4 -->
      <button class="btn btn-number" data-number="1">1</button>
      <button class="btn btn-number" data-number="2">2</button>
      <button class="btn btn-number" data-number="3">3</button>
      <button class="btn btn-operator" data-operator="+" title="Add (+)">+</button>

      <!-- Row 5 -->
      <button class="btn btn-action" data-action="negate" title="Toggle Sign (±)">±</button>
      <button class="btn btn-number" data-number="0">0</button>
      <button class="btn btn-number" data-number=".">.</button>
      <button class="btn btn-equals" data-action="equals" title="Calculate (= or Enter)">=</button>
    </div>

    <!-- Footer hint for keyboard support -->
    <div class="calculator-footer">
      <span>Keyboard Support Enabled</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
